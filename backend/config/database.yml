default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  url: <%= ENV.fetch("DATABASE_URL", "postgres://ledgerly:ledgerly@db:5432/ledgerly_development") %>
development:
  <<: *default
test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://ledgerly:ledgerly@db:5432/ledgerly_test") %>
production:
  <<: *default
